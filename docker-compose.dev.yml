services:
  db:
    image: postgres:16-alpine
    container_name: media-storage-postgres
    environment:
      POSTGRES_USER: media_storage
      POSTGRES_PASSWORD: media_storage_dev
      POSTGRES_DB: media_storage
    ports:
      - "5432:5432"
    volumes:
      - media_storage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_storage -d media_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media_storage_postgres_data:
